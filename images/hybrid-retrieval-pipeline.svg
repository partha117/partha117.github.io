<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 510" width="560" height="510">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="#7f8c9a"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="560" height="510" fill="#ffffff"/>

  <!-- ── QUERY ── -->
  <rect x="180" y="16" width="200" height="46" rx="8" fill="#1d3557" filter="url(#shadow)"/>
  <text x="280" y="45" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#ffffff">Query</text>

  <!-- arrows: query → bm25 -->
  <line x1="245" y1="62" x2="130" y2="112" stroke="#7f8c9a" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- arrows: query → dense -->
  <line x1="315" y1="62" x2="430" y2="112" stroke="#7f8c9a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── BM25 ── -->
  <rect x="15" y="112" width="215" height="78" rx="8" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="122" y="140" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#1d3557">BM25</text>
  <text x="122" y="158" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#2980b9">sparse retrieval</text>
  <text x="122" y="178" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">exact keyword match</text>

  <!-- ── Dense Encoder ── -->
  <rect x="330" y="112" width="215" height="78" rx="8" fill="#eaf2fb" stroke="#2980b9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="437" y="140" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#1d3557">Dense Encoder</text>
  <text x="437" y="158" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#2980b9">BGE / E5</text>
  <text x="437" y="178" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#888888">semantic similarity</text>

  <!-- "top-k" labels on converging arrows -->
  <text x="172" y="222" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#aaaaaa" transform="rotate(-35,172,222)">top-k</text>
  <text x="388" y="222" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#aaaaaa" transform="rotate(35,388,222)">top-k</text>

  <!-- arrows: bm25 → fuse -->
  <line x1="122" y1="190" x2="218" y2="252" stroke="#7f8c9a" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- arrows: dense → fuse -->
  <line x1="437" y1="190" x2="342" y2="252" stroke="#7f8c9a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Fuse (RRF) ── -->
  <rect x="165" y="252" width="230" height="54" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="280" y="277" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#7d6608">Fuse (RRF)</text>
  <text x="280" y="295" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#a07520">Reciprocal Rank Fusion</text>

  <!-- "~100 candidates" label -->
  <text x="296" y="342" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#aaaaaa">~100 candidates</text>

  <!-- arrow: fuse → reranker -->
  <line x1="280" y1="306" x2="280" y2="350" stroke="#7f8c9a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Reranker ── -->
  <rect x="165" y="350" width="230" height="68" rx="8" fill="#fdedec" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="280" y="376" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#922b21">Reranker</text>
  <text x="280" y="394" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#c0392b">cross-encoder</text>
  <text x="280" y="410" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#888888">query + passage → relevance score</text>

  <!-- arrow: reranker → result -->
  <line x1="280" y1="418" x2="280" y2="462" stroke="#7f8c9a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Final Ranked List ── -->
  <rect x="165" y="462" width="230" height="40" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="280" y="488" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#1e8449">Final Ranked List</text>
</svg>
