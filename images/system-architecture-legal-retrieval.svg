  <text x="334" y="269" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="7.5" fill="#2980b9">Lex · Dense</text>
  <text x="334" y="282" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="7.5" fill="#2980b9">Graph · Symbolic</text>

  <text x="392" y="271" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#7f8c9a">›</text>

