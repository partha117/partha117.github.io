  <rect x="716" y="28" width="118" height="54" rx="6" fill="#4a235a" filter="url(#shadow)"/>
  <text x="775" y="45" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" font-weight="700" fill="#fff">Rule Compiler</text>
