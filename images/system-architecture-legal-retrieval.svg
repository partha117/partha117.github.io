  <text x="682" y="255" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" font-weight="700" fill="#9a5b00">Calibrate</text>
  <text x="682" y="269" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="7.5" fill="#ca7a0a">isotonic</text>
