  <text x="255" y="59" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#a0b4c8">text · geometry</text>
  <text x="255" y="72" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#a0b4c8">OCR · LayoutLM</text>

