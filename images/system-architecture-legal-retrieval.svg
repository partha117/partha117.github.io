  <text x="125" y="59" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#a0b4c8">statutes · bulletins</text>
  <text x="125" y="72" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#a0b4c8">manuals · opinions</text>

  <text x="196" y="59" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#7f8c9a">›</text>

